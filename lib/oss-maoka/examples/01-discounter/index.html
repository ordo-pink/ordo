<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Maoka Discounter Example</title>
	</head>
	<body>
		<div id="app"></div>
		<script src="../maoka.js"></script>
		<script>
			const root = document.getElementById("app")

			const Discounter = Maoka.create("button", ({ element, refresh }) => {
				let state = 0

				element.onclick = () => {
					state--
					refresh()
				}

				return () => String(state)
			})

			MaokaDOM.render(root, Discounter, () => crypto.randomUUID()).then(console.log)
		</script>
	</body>
</html>

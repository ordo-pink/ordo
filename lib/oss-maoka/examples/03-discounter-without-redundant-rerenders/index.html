<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Maoka Split Discounter Example</title>
	</head>
	<body>
		<div id="app"></div>
		<script src="../maoka.js"></script>
		<script>
			const root = document.getElementById("app")

			const DiscounterButton = onclick =>
				Maoka.create("button", ({ element }) => {
					element.onclick = onclick

					return () => "Click me!"
				})

			const Discounter = Maoka.create("div", ({ refresh }) => {
				let state = 0

				const DiscounterText = Maoka.create("div", () => {
					return () => String(state)
				})

				const handle_discounter_button_click = () => {
					state++
					DiscounterText.refresh()
				}

				return () => [DiscounterText, DiscounterButton(handle_discounter_button_click)]
			})

			MaokaDOM.render(root, Discounter, () => crypto.randomUUID()).then(console.log)
		</script>
	</body>
</html>
